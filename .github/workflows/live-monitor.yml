name: Custody Folio Live Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      RECORDS_APP_BASE_URL: https://custodyfolio.com
    steps:
      - name: Check live records app
        run: |
          node <<'NODE'
          const baseUrl = process.env.RECORDS_APP_BASE_URL.replace(/\/$/, "");
          const allowedPendingLaunchBlockers = new Set([
            "backup-restore-tested",
            "data-retention-policy",
            "incident-response-plan",
            "legal-review",
            "billing:billing-checkout-enabled",
            "billing:production-readiness",
            "billing:apple-notifications-v2",
            "billing:billing-tests-recent",
            "billing:billing-policy-versions",
            "billing:billing-tax-review",
            "billing:live-billing-approval",
          ]);

          const requiredBillingServicingChecks = [
            "billing-mode-live",
            "stripe-live-key",
            "stripe-live-webhook",
            "stripe-price-allowlist",
            "stripe-live-portal-configuration",
            "stripe-portal-verified",
            "billing-secrets",
            "apple-identity",
            "apple-server-api",
          ];

          function fail(message) {
            console.error(message);
            process.exitCode = 1;
          }

          async function get(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: "application/json,text/html,*/*",
                ...(options.headers || {}),
              },
            });
            return response;
          }

          const recordsResponse = await get(`${baseUrl}/records`);
          if (!recordsResponse.ok) {
            fail(`/records returned HTTP ${recordsResponse.status}`);
          }
          const recordsHtml = await recordsResponse.text();

          const requiredHeaders = [
            "content-security-policy",
            "strict-transport-security",
            "x-content-type-options",
            "x-frame-options",
            "referrer-policy",
            "permissions-policy",
          ];

          for (const header of requiredHeaders) {
            if (!recordsResponse.headers.get(header)) {
              fail(`/records is missing ${header}`);
            }
          }

          const csp = recordsResponse.headers.get("content-security-policy") || "";
          const scriptSrc = csp
            .split(";")
            .map((part) => part.trim())
            .find((part) => part.toLowerCase().startsWith("script-src"));
          if (!scriptSrc || !scriptSrc.includes("'nonce-")) {
            fail("/records CSP script-src is missing a nonce.");
          }
          if (scriptSrc?.includes("'unsafe-inline'") || scriptSrc?.includes("'unsafe-eval'")) {
            fail("/records CSP script-src allows an unsafe script source.");
          }
          if (!/<script[^>]+nonce=/.test(recordsHtml)) {
            fail("/records HTML does not include nonce-bearing script tags.");
          }
          if (recordsResponse.headers.get("x-frame-options")?.trim().toUpperCase() !== "DENY") {
            fail("/records x-frame-options is not DENY.");
          }
          if (recordsResponse.headers.get("x-content-type-options")?.trim().toLowerCase() !== "nosniff") {
            fail("/records x-content-type-options is not nosniff.");
          }

          const fakeLoginResponse = await fetch(`${baseUrl}/api/records/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
              Origin: baseUrl,
              "Sec-Fetch-Site": "same-origin",
            },
            body: JSON.stringify({
              email: "deploy-monitor@example.invalid",
              password: "not-a-real-password",
              adultConfirmed: true,
            }),
          });
          if (![400, 401].includes(fakeLoginResponse.status)) {
            fail(`Fake login returned HTTP ${fakeLoginResponse.status}; expected handled 400 or 401.`);
          }
          if (!fakeLoginResponse.headers.get("content-type")?.includes("application/json")) {
            fail("Fake login did not return JSON content-type.");
          }

          const readinessResponse = await get(`${baseUrl}/api/records/readiness`);
          if (![200, 503].includes(readinessResponse.status)) {
            fail(`/api/records/readiness returned unexpected HTTP ${readinessResponse.status}.`);
          }

          const readiness = await readinessResponse.json().catch(() => ({}));
          if (!Array.isArray(readiness.blockers)) {
            fail("Readiness response does not include blockers array.");
          }
          if (!Array.isArray(readiness.checks)) {
            fail("Readiness response does not include checks array.");
          }

          const blockers = Array.isArray(readiness.blockers) ? readiness.blockers : [];
          const checks = Array.isArray(readiness.checks) ? readiness.checks : [];
          const billingChecks = Array.isArray(readiness.billing?.checks)
            ? readiness.billing.checks
            : [];
          const invalidBlockers = blockers.filter(
            (item) => typeof item?.id !== "string" || item.id.length === 0
          );
          const invalidChecks = checks.filter(
            (item) => typeof item?.id !== "string" || item.id.length === 0
          );
          const invalidBillingChecks = billingChecks.filter(
            (item) => typeof item?.id !== "string" || item.id.length === 0
          );
          if (
            invalidBlockers.length > 0 ||
            invalidChecks.length > 0 ||
            invalidBillingChecks.length > 0
          ) {
            fail("Readiness response includes malformed blocker or check identifiers.");
          }

          if (readiness.billing?.required === true && !Array.isArray(readiness.billing?.checks)) {
            fail("Readiness response requires billing but omits the billing checks catalog.");
          }

          const blockerIds = blockers
            .map((item) => item.id)
            .filter((id) => typeof id === "string" && id.length > 0);
          const declaredCheckIds = new Set(
            [
              ...checks.map((item) => item.id),
              ...billingChecks.map((item) => `billing:${item.id}`),
            ].filter((id) => typeof id === "string" && id.length > 0)
          );
          const undeclared = blockerIds.filter((id) => !declaredCheckIds.has(id));
          if (undeclared.length > 0) {
            fail(`Readiness blockers missing from checks catalog: ${undeclared.join(", ")}`);
          }

          if (!["ready", "not_ready"].includes(readiness.status)) {
            fail(`Readiness status is ${String(readiness.status || "missing")}; expected ready or not_ready.`);
          }

          const expectedReadinessHttpStatus = readiness.status === "ready" ? 200 : 503;
          if (readinessResponse.status !== expectedReadinessHttpStatus) {
            fail(
              `Readiness HTTP ${readinessResponse.status} does not match status ${String(readiness.status)}.`
            );
          }

          if (readiness.status === "ready" && blockerIds.length > 0) {
            fail(`Readiness is ready but still reports blockers: ${blockerIds.join(", ")}`);
          }
          if (readiness.status === "not_ready" && blockerIds.length === 0) {
            fail("Readiness is not_ready without an explanatory blocker.");
          }

          const unexpectedBlockers = blockerIds.filter(
            (id) => !allowedPendingLaunchBlockers.has(id)
          );
          if (unexpectedBlockers.length > 0) {
            fail(`Unexpected production readiness blockers: ${unexpectedBlockers.join(", ")}`);
          }

          const billingCheckById = new Map(
            billingChecks.map((item) => [item.id, item])
          );
          const pendingBillingBlockers = blockerIds.filter((id) => id.startsWith("billing:"));
          if (pendingBillingBlockers.length > 0) {
            const unhealthyServicingChecks = requiredBillingServicingChecks.filter(
              (id) => billingCheckById.get(id)?.ready !== true
            );
            if (unhealthyServicingChecks.length > 0) {
              fail(
                `Live billing servicing checks are unhealthy: ${unhealthyServicingChecks.join(", ")}`
              );
            }
          }

          if (blockerIds.length > 0) {
            console.warn(`Customer launch approval blockers remain: ${blockerIds.join(", ")}`);
          }

          console.log(
            JSON.stringify(
              {
                checkedAt: new Date().toISOString(),
                url: baseUrl,
                readinessStatus: readiness.status,
                knownBlockers: blockerIds,
              },
              null,
              2
            )
          );
          NODE

      - name: Close monitor issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_issue="$(gh issue list --state open --label live-monitor --json number --jq '.[0].number // empty')"
          if [ -z "$existing_issue" ]; then
            exit 0
          fi

          gh issue comment "$existing_issue" --body "Live monitor recovered: ${RUN_URL}"
          gh issue close "$existing_issue" --reason completed

      - name: Open monitor issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-monitor \
            --color "B60205" \
            --description "Automated production availability monitor" \
            --force

          existing_issue="$(gh issue list --state open --label live-monitor --json number --jq '.[0].number // empty')"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body "Live monitor failed again: ${RUN_URL}"
            exit 0
          fi

          gh issue create \
            --title "Custody Folio live monitor failed" \
            --label "live-monitor" \
            --body "The scheduled live monitor failed. Review the workflow run: ${RUN_URL}"
